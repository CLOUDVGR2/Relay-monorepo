server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Forwarded request metadata
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Express API
    location = /api {
        proxy_pass http://express-api:5001;
    }

    location ^~ /api/ {
        proxy_pass http://express-api:5001;
    }

    # Socket.IO and WebSocket connections
    location ^~ /socket.io/ {
        proxy_pass http://express-api:5001;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # NestJS API and GraphQL
    location = /jobs {
        proxy_pass http://nest-api:3000;
    }

    location ^~ /jobs/ {
        proxy_pass http://nest-api:3000;
    }

    location = /graphql {
        proxy_pass http://nest-api:3000;
    }

    location ^~ /graphql/ {
        proxy_pass http://nest-api:3000;
    }

    location = /health {
        proxy_pass http://nest-api:3000/health;
    }

    location = /docs {
        proxy_pass http://nest-api:3000;
    }

    location ^~ /docs/ {
        proxy_pass http://nest-api:3000;
    }

    # Go jobs API readiness endpoints
    location = /go/readyz {
        proxy_pass http://jobs-api:8081/readyz;
    }

    location = /rabbitmqz {
        proxy_pass http://jobs-api:8081/rabbitmqz;
    }

    # Python AI service readiness
    location = /python/readyz {
        proxy_pass http://ai-service:8000/readyz;
    }

    # API gateway readiness
    location = /gateway/healthz {
        proxy_pass http://api-gateway:8090/healthz;
    }

    # Frontend single-page application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;
}
