name: Security and Supply Chain

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.24.2
        env:
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: safe.directory
          GIT_CONFIG_VALUE_0: /github/workspace
        with:
          args: detect --source=. --redact --exit-code=1

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      # Temporary Expo SDK 57 exceptions; review when upstream fixes are available.
      - name: Audit locked dependencies
        run: >-
          pnpm audit --audit-level high
          --ignore GHSA-86w9-cpqp-85rv
          --ignore GHSA-mrhx-c7xc-m3w5

  python-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install audit tooling
        run: python -m pip install --upgrade pip pip-audit
      - name: Audit declared Python dependencies
        working-directory: services/ai-service
        run: pip-audit -r requirements.txt

  go-audit:
    name: Go vulnerability audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - services/api-gateway
          - services/jobs-api
          - services/jobs-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: false
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan reachable Go vulnerabilities
        working-directory: ${{ matrix.module }}
        run: "$(go env GOPATH)/bin/govulncheck ./..."

  filesystem-scan:
    name: Filesystem and configuration scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
          format: table
