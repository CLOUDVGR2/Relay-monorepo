name: Kubernetes and AWS Readiness

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kubernetes-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-validation:
    name: Validate ${{ matrix.overlay }} overlay
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        overlay:
          - local
          - aws

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.34.0

      - name: Set up Go for kubeconform
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.3"
          cache: false

      - name: Install kubeconform
        run: go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7

      - name: Render Kubernetes overlay
        run: |
          kubectl kustomize \
            "infrastructure/kubernetes/overlays/${{ matrix.overlay }}" \
            > "/tmp/relay-${{ matrix.overlay }}-rendered.yaml"

      - name: Validate Kubernetes schemas
        run: |
          "$(go env GOPATH)/bin/kubeconform" \
            -strict \
            -ignore-missing-schemas \
            -summary \
            "/tmp/relay-${{ matrix.overlay }}-rendered.yaml"

  api-gateway:
    name: API Gateway tests and image build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/api-gateway/go.mod
          cache: false

      - name: Run Go tests
        working-directory: services/api-gateway
        run: go test ./... -count=1

      - name: Run Go vet
        working-directory: services/api-gateway
        run: go vet ./...

      - name: Build API Gateway Docker image
        run: |
          docker build \
            -t relay-api-gateway:ci \
            -f services/api-gateway/Dockerfile \
            services/api-gateway
