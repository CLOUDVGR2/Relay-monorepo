global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: docker-containers
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: relay-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://express-api:5001/api/health/ready
          - http://nest-api:3000/health/ready
          - http://api-gateway:8090/healthz
          - http://jobs-api:8081/readyz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: relay-api-metrics
    metrics_path: /metrics
    static_configs:
      - targets: ["express-api:5001"]
        labels:
          service: express-api
      - targets: ["nest-api:3000"]
        labels:
          service: nest-api
