apiVersion: apps/v1
kind: Deployment
metadata:
  name: recording-worker
  namespace: relay
  labels:
    app.kubernetes.io/name: recording-worker
    app.kubernetes.io/part-of: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: recording-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: recording-worker
        app.kubernetes.io/part-of: relay
    spec:
      terminationGracePeriodSeconds: 300
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: recording-worker
          image: relay-recording-worker:local
          imagePullPolicy: IfNotPresent
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: python-ai-secret
                  key: database-url
            - name: REDIS_URL
              value: redis://redis:6379
            - name: CALL_RECORDING_STORAGE_ENDPOINT
              value: http://rustfs:9000
            - name: CALL_RECORDING_STORAGE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: nest-api-config
                  key: CALL_RECORDING_STORAGE_BUCKET
            - name: CALL_RECORDING_STORAGE_REGION
              valueFrom:
                configMapKeyRef:
                  name: nest-api-config
                  key: CALL_RECORDING_STORAGE_REGION
            - name: CALL_RECORDING_STORAGE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: nest-api-secret
                  key: CALL_RECORDING_STORAGE_ACCESS_KEY_ID
            - name: CALL_RECORDING_STORAGE_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: nest-api-secret
                  key: CALL_RECORDING_STORAGE_SECRET_ACCESS_KEY
            - name: CALL_RECORDING_STORAGE_FORCE_PATH_STYLE
              valueFrom:
                configMapKeyRef:
                  name: nest-api-config
                  key: CALL_RECORDING_STORAGE_FORCE_PATH_STYLE
            - name: WHISPER_MODEL_SIZE
              value: tiny
            - name: WHISPER_DEVICE
              value: cpu
            - name: WHISPER_COMPUTE_TYPE
              value: int8
            - name: WHISPER_CPU_THREADS
              value: "2"
            - name: RECORDING_JOB_LEASE_SECONDS
              value: "120"
            - name: RECORDING_JOB_HEARTBEAT_SECONDS
              value: "40"
            - name: RECORDING_JOB_MAX_ATTEMPTS
              value: "3"
            - name: RECORDING_JOB_RETRY_DELAY_SECONDS
              value: "30"
            - name: RECORDING_WORKER_POLL_SECONDS
              value: "3"
            - name: LOG_LEVEL
              value: INFO
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: model-cache
              mountPath: /home/worker/.cache/huggingface
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: model-cache
          persistentVolumeClaim:
            claimName: recording-worker-cache
