apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-worker
  labels: &id001
    app.kubernetes.io/name: go-worker
    app.kubernetes.io/part-of: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-worker
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: go-worker
        image: relay-go-worker:local
        imagePullPolicy: IfNotPresent
        ports: []
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        env:
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: username
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password
        envFrom:
        - configMapRef:
            name: go-worker-config
