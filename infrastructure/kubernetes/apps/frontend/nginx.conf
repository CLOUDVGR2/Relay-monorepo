upstream api_gateway {
    zone api_gateway 64k;
    resolver 10.96.0.10 valid=10s ipv6=off;
    server api-gateway.relay.svc.cluster.local:8090 resolve;
}

upstream go_api {
    zone go_api 64k;
    resolver 10.96.0.10 valid=10s ipv6=off;
    server go-api.relay.svc.cluster.local:8081 resolve;
}

upstream python_ai {
    zone python_ai 64k;
    resolver 10.96.0.10 valid=10s ipv6=off;
    server python-ai.relay.svc.cluster.local:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Forwarded request metadata
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Express API
    location = /api {
        proxy_pass http://api_gateway;
    }

    location ^~ /api/ {
        proxy_pass http://api_gateway;
    }

    # Socket.IO and WebSocket connections
    location ^~ /socket.io/ {
        proxy_pass http://api_gateway;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # NestJS API and GraphQL
    location = /jobs {
        proxy_pass http://api_gateway;
    }

    location ^~ /jobs/ {
        proxy_pass http://api_gateway;
    }

    # Calls API
    location = /calls {
        proxy_pass http://api_gateway;
    }

    location ^~ /calls/ {
        proxy_pass http://api_gateway;
    }

    location = /graphql {
        proxy_pass http://api_gateway;
    }

    location ^~ /graphql/ {
        proxy_pass http://api_gateway;
    }

    location = /health {
        proxy_pass http://api_gateway/health;
    }

    location = /health/ready {
        proxy_pass http://api_gateway/health/ready;
    }

    location = /docs {
        proxy_pass http://api_gateway;
    }

    location ^~ /docs/ {
        proxy_pass http://api_gateway;
    }

    # Go jobs API readiness endpoints
    location = /go/readyz {
        proxy_pass http://go_api/readyz;
    }

    location = /go/worker-health {
        proxy_pass http://go_api/worker-health;
    }

    location = /rabbitmqz {
        proxy_pass http://go_api/rabbitmqz;
    }

    # Python AI service readiness
    location = /python/readyz {
        proxy_pass http://python_ai/readyz;
    }

    # API gateway readiness
    location = /gateway/healthz {
        proxy_pass http://api_gateway/healthz;
    }

    location = /gateway/readyz {
        proxy_pass http://api_gateway/readyz;
    }

    # Frontend single-page application fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript;
}
