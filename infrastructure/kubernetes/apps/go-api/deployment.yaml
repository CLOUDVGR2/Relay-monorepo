apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  labels: &id001
    app.kubernetes.io/name: go-api
    app.kubernetes.io/part-of: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-api
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: go-api
        image: relay-go-api:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8081
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: go-api-secret
              key: internal-api-token
        - name: RABBITMQ_DEFAULT_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: username
        - name: RABBITMQ_DEFAULT_PASS
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password
        envFrom:
        - configMapRef:
            name: go-api-config
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
