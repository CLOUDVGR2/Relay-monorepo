apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-ai
  labels: &id001
    app.kubernetes.io/name: python-ai
    app.kubernetes.io/part-of: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: python-ai
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: python-ai
        image: relay-python-ai:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: python-ai-secret
              key: database-url
        - name: PYTHON_AI_INTERNAL_TOKEN
          valueFrom:
            secretKeyRef:
              name: python-ai-secret
              key: python-ai-token
        envFrom:
        - configMapRef:
            name: python-ai-config
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
