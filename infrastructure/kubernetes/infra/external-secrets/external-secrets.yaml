apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: relay-aws-secrets-manager
    kind: SecretStore
  target:
    name: backend-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: mongodb-uri
      remoteRef:
        key: relay/dev/backend-secret
        property: mongodb-uri
    - secretKey: jwt-secret
      remoteRef:
        key: relay/dev/backend-secret
        property: jwt-secret
    - secretKey: python-ai-token
      remoteRef:
        key: relay/dev/backend-secret
        property: python-ai-token
---
