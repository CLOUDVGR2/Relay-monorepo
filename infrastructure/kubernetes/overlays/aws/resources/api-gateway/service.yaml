apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: relay
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8090
      targetPort: 8090
      protocol: TCP
    - name: metrics
      port: 9091
      targetPort: 9091
      protocol: TCP
