apiVersion: apps/v1
kind: Deployment
metadata:
  name: nest-api
  labels: &id001
    app.kubernetes.io/name: nest-api
    app.kubernetes.io/part-of: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nest-api
  template:
    metadata:
      labels: *id001
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: nest-api
        image: relay-nest-api:local
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: nest-api-secret
              key: mongodb-uri
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: nest-api-secret
              key: database-url
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: nest-api-secret
              key: jwt-secret
        - name: INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: nest-api-secret
              key: internal-api-token
        envFrom:
        - configMapRef:
            name: nest-api-config
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
