apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  template:
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              $patch: delete
            - name: MONGO_INITDB_ROOT_PASSWORD
              $patch: delete
          livenessProbe:
            timeoutSeconds: 5
            exec:
              command:
                - sh
                - -ec
                - "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
          readinessProbe:
            timeoutSeconds: 5
            exec:
              command:
                - sh
                - -ec
                - "mongosh --quiet --eval 'db.adminCommand({ping: 1}).ok'"
