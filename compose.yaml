name: relay-monorepo

services:
  mongodb:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:27018:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - relay-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: atlas_ai
      POSTGRES_USER: atlas_ai
      POSTGRES_PASSWORD: ${ATLAS_POSTGRES_PASSWORD:?Set ATLAS_POSTGRES_PASSWORD in root .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - atlas_postgres_data:/var/lib/postgresql/data
    networks:
      - relay-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas_ai -d atlas_ai"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - relay-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  rabbitmq:
    image: rabbitmq:4-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in root .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in root .env}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - relay-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m

  rustfs-permissions:
    image: busybox:1.37.0
    user: "0:0"
    command: ["sh", "-c", "chown -R 10001:10001 /data"]
    restart: "no"
    volumes:
      - call_recording_storage_data:/data
    mem_limit: 64m
    pids_limit: 20

  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    init: true
    command: ["/data"]
    ports:
      - "9000:9000"
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${CALL_RECORDING_STORAGE_ACCESS_KEY_ID:?Set CALL_RECORDING_STORAGE_ACCESS_KEY_ID in root .env}
      RUSTFS_SECRET_KEY: ${CALL_RECORDING_STORAGE_SECRET_ACCESS_KEY:?Set CALL_RECORDING_STORAGE_SECRET_ACCESS_KEY in root .env}
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - call_recording_storage_data:/data
    networks:
      - relay-network
    depends_on:
      rustfs-permissions:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 150

  ai-service:
    image: relay-monorepo-ai-service:local
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      CLIENT_URL: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088
      DATABASE_URL: "postgresql+asyncpg://atlas_ai:${ATLAS_POSTGRES_PASSWORD:?Set ATLAS_POSTGRES_PASSWORD in root .env}@postgres:5432/atlas_ai"
      PYTHON_AI_INTERNAL_TOKEN: ${PYTHON_AI_INTERNAL_TOKEN:?Set PYTHON_AI_INTERNAL_TOKEN in root .env}
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      AI_PROVIDER: ${AI_PROVIDER:-litellm}
      LITELLM_MODEL: ${LITELLM_MODEL:-ollama_chat/qwen2.5:3b-instruct}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-http://host.docker.internal:11434}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - relay-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/openapi.json', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 150


  multi-agent-worker:
    image: relay-monorepo-ai-service:local
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile
    command: ["python", "-m", "app.multi_agent.worker"]
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: "postgresql+asyncpg://atlas_ai:${ATLAS_POSTGRES_PASSWORD:?Set ATLAS_POSTGRES_PASSWORD in root .env}@postgres:5432/atlas_ai"
      REDIS_URL: redis://redis:6379
      MULTI_AGENT_PROVIDER: ${MULTI_AGENT_PROVIDER:-mock}
      MULTI_AGENT_MODEL: ${MULTI_AGENT_MODEL:-ollama_chat/qwen2.5:3b-instruct}
      MULTI_AGENT_TIMEOUT_SECONDS: ${MULTI_AGENT_TIMEOUT_SECONDS:-20}
      AI_PROVIDER_API_KEY: ${AI_PROVIDER_API_KEY:-}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-http://host.docker.internal:11434}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    networks:
      - relay-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 100
    stop_grace_period: 35s

  recording-worker:
    image: relay-recording-worker:local
    build:
      context: ./services/ai-service
      dockerfile: Dockerfile.recording-worker
    restart: unless-stopped
    init: true
    environment:
      DATABASE_URL: "postgresql+asyncpg://atlas_ai:${ATLAS_POSTGRES_PASSWORD:?Set ATLAS_POSTGRES_PASSWORD in root .env}@postgres:5432/atlas_ai"
      REDIS_URL: redis://redis:6379
      PYTHON_AI_BASE_URL: http://ai-service:8000
      PYTHON_AI_INTERNAL_TOKEN: ${PYTHON_AI_INTERNAL_TOKEN:?Set PYTHON_AI_INTERNAL_TOKEN in root .env}
      CALL_RECORDING_STORAGE_ENDPOINT: http://rustfs:9000
      CALL_RECORDING_STORAGE_BUCKET: ${CALL_RECORDING_STORAGE_BUCKET:?Set CALL_RECORDING_STORAGE_BUCKET in root .env}
      CALL_RECORDING_STORAGE_REGION: ${CALL_RECORDING_STORAGE_REGION:?Set CALL_RECORDING_STORAGE_REGION in root .env}
      CALL_RECORDING_STORAGE_ACCESS_KEY_ID: ${CALL_RECORDING_STORAGE_ACCESS_KEY_ID:?Set CALL_RECORDING_STORAGE_ACCESS_KEY_ID in root .env}
      CALL_RECORDING_STORAGE_SECRET_ACCESS_KEY: ${CALL_RECORDING_STORAGE_SECRET_ACCESS_KEY:?Set CALL_RECORDING_STORAGE_SECRET_ACCESS_KEY in root .env}
      CALL_RECORDING_STORAGE_FORCE_PATH_STYLE: ${CALL_RECORDING_STORAGE_FORCE_PATH_STYLE:-true}
      WHISPER_MODEL_SIZE: tiny
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
      WHISPER_CPU_THREADS: "2"
      RECORDING_JOB_LEASE_SECONDS: "120"
      RECORDING_JOB_HEARTBEAT_SECONDS: "40"
      RECORDING_JOB_MAX_ATTEMPTS: "3"
      RECORDING_JOB_RETRY_DELAY_SECONDS: "30"
      RECORDING_WORKER_POLL_SECONDS: "3"
      LOG_LEVEL: INFO
    volumes:
      - recording_worker_model_cache:/home/worker/.cache/huggingface
    networks:
      - relay-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 100
    stop_grace_period: 5m

  express-api:
    image: relay-monorepo-express-api:local
    build:
      context: .
      dockerfile: services/express-api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: "5001"
      MONGODB_URI: mongodb://mongodb:27017/relay
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      REDIS_URL: redis://redis:6379
      CLIENT_URL: http://localhost:80,http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PYTHON_AI_BASE_URL: http://ai-service:8000
      PYTHON_AI_INTERNAL_TOKEN: ${PYTHON_AI_INTERNAL_TOKEN:?Set PYTHON_AI_INTERNAL_TOKEN in root .env}
      CALL_EVENTS_INTERNAL_TOKEN: ${CALL_EVENTS_INTERNAL_TOKEN:?Set CALL_EVENTS_INTERNAL_TOKEN in root .env}
      NEST_API_BASE_URL: http://nest-api:3000
    ports:
      - "127.0.0.1:5001:5001"
    networks:
      - relay-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5001/api/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200

  nest-api:
    image: relay-monorepo-nest-api:local
    build:
      context: .
      dockerfile: services/nest-api/Dockerfile
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      CLIENT_URL: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088
      PORT: "3000"
      DATABASE_URL: "postgresql://atlas_ai:${ATLAS_POSTGRES_PASSWORD:?Set ATLAS_POSTGRES_PASSWORD in root .env}@postgres:5432/atlas_ai"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      REDIS_URL: redis://redis:6379
      MONGODB_URI: mongodb://mongodb:27017/relay
      GO_API_BASE_URL: http://jobs-api:8081
      PYTHON_AI_BASE_URL: http://ai-service:8000
      PYTHON_AI_INTERNAL_TOKEN: ${PYTHON_AI_INTERNAL_TOKEN:?Set PYTHON_AI_INTERNAL_TOKEN in root .env}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in root .env}
      CALL_EVENTS_BASE_URL: http://express-api:5001
      CALL_EVENTS_INTERNAL_TOKEN: ${CALL_EVENTS_INTERNAL_TOKEN:?Set CALL_EVENTS_INTERNAL_TOKEN in root .env}
      CALL_RECORDING_STORAGE_ENDPOINT: http://rustfs:9000
      CALL_RECORDING_STORAGE_PUBLIC_ENDPOINT: ${CALL_RECORDING_STORAGE_PUBLIC_ENDPOINT:?Set CALL_RECORDING_STORAGE_PUBLIC_ENDPOINT in root .env}
      CALL_RECORDING_STORAGE_BUCKET: ${CALL_RECORDING_STORAGE_BUCKET:?Set CALL_RECORDING_STORAGE_BUCKET in root .env}
      CALL_RECORDING_STORAGE_REGION: ${CALL_RECORDING_STORAGE_REGION:?Set CALL_RECORDING_STORAGE_REGION in root .env}
      CALL_RECORDING_STORAGE_ACCESS_KEY_ID: ${CALL_RECORDING_STORAGE_ACCESS_KEY_ID:?Set CALL_RECORDING_STORAGE_ACCESS_KEY_ID in root .env}
      CALL_RECORDING_STORAGE_SECRET_ACCESS_KEY: ${CALL_RECORDING_STORAGE_SECRET_ACCESS_KEY:?Set CALL_RECORDING_STORAGE_SECRET_ACCESS_KEY in root .env}
      CALL_RECORDING_STORAGE_FORCE_PATH_STYLE: ${CALL_RECORDING_STORAGE_FORCE_PATH_STYLE:-true}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - relay-network
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 200

  jobs-api:
    image: relay-monorepo-jobs-api:local
    build:
      context: ./services/jobs-api
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: "8081"
      CLIENT_URL: http://localhost:5173,http://127.0.0.1:5173,http://localhost:8088,http://127.0.0.1:8088
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN in root .env}
      REDIS_URL: redis://redis:6379
      RABBITMQ_HOST: rabbitmq:5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in root .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in root .env}
    ports:
      - "127.0.0.1:8083:8081"
    networks:
      - relay-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 100

  jobs-worker:
    image: relay-monorepo-jobs-worker:local
    build:
      context: ./services/jobs-worker
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      REDIS_URL: redis://redis:6379
      RABBITMQ_HOST: rabbitmq:5672
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER in root .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in root .env}
    networks:
      - relay-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 100
    stop_grace_period: 35s

  api-gateway:
    image: relay-monorepo-api-gateway:local
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      GATEWAY_PORT: "8090"
      GATEWAY_EXPRESS_URL: http://express-api:5001
      GATEWAY_NEST_URL: http://nest-api:3000
      GATEWAY_GO_URL: http://jobs-api:8081
      GATEWAY_PYTHON_URL: http://ai-service:8000
    ports:
      - "8090:8090"
    networks:
      - relay-network
    depends_on:
      express-api:
        condition: service_healthy
      nest-api:
        condition: service_healthy
      jobs-api:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    pids_limit: 100

  frontend:
    image: relay-monorepo-web:local
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - relay-network
    depends_on:
      express-api:
        condition: service_started
      nest-api:
        condition: service_started
      jobs-api:
        condition: service_started
      api-gateway:
        condition: service_started


  mobile:
    image: relay-monorepo-mobile:local
    build:
      context: .
      dockerfile: apps/mobile/Dockerfile
    restart: unless-stopped
    init: true
    working_dir: /workspace/apps/mobile
    env_file:
      - ./apps/mobile/.env
    environment:
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      EXPO_NO_TELEMETRY: "1"
      REACT_NATIVE_PACKAGER_HOSTNAME: ${MOBILE_HOST_IP:-10.94.194.50}
    ports:
      - "8081:8081"
    volumes:
      - ./apps/mobile:/workspace/apps/mobile
      - mobile_root_node_modules:/workspace/node_modules
      - mobile_node_modules:/workspace/apps/mobile/node_modules
    networks:
      - relay-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8081/status').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s


  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - relay_prometheus_data:/prometheus
    networks:
      - relay-network
    depends_on:
      - blackbox-exporter
      - cadvisor
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in root .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://localhost:3001
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - relay_grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - relay-network
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - relay-network
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox_exporter/config.yml
    volumes:
      - ./monitoring/blackbox/config.yml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - relay-network
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m

networks:
  relay-network:
    name: relay-monorepo_network
    driver: bridge

volumes:
  relay_prometheus_data:
    name: relay-monorepo_prometheus_data
  relay_grafana_data:
    name: relay-monorepo_grafana_data
  call_recording_storage_data:
    name: relay-monorepo_call_recording_storage_data
  recording_worker_model_cache:
    name: relay-monorepo_recording_worker_model_cache
    external: true
  mongodb_data:
    name: relay-monorepo_mongodb_data
  atlas_postgres_data:
    name: relay-monorepo_atlas_postgres_data
  redis_data:
    name: relay-monorepo_redis_data
  rabbitmq_data:
    name: relay-monorepo_rabbitmq_data
  mobile_root_node_modules:
  mobile_node_modules:
